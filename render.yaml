# Render blueprint for the AEOMirror backend (Phase 10).
# Frontend is deployed separately on Vercel (see frontend/vercel.json).
#
# Provisions: API web service, a standalone monitoring worker, managed PostgreSQL,
# and managed Redis. Secrets (JWT_SECRET, STRIPE_*, RESEND_API_KEY, SENTRY_DSN,
# ADMIN_EMAILS) are set in the Render dashboard, never committed.

databases:
  - name: aeomirror-db
    databaseName: aeomirror
    plan: starter
    postgresMajorVersion: "16"

services:
  # ---------------- managed Redis ----------------
  - type: redis
    name: aeomirror-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []          # only reachable from Render services

  # ---------------- API ----------------
  - type: web
    name: aeomirror-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    # Apply DB migrations ONCE per deploy, before the new version starts serving.
    # Race-free (runs before any instance boots) and the single source of schema
    # truth, so a released image never queries columns/tables that don't exist yet.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SCHEDULER_ENABLED
        value: "false"        # the worker service runs scans instead
      - key: ENABLE_HSTS
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ORIGINS
        value: https://aeomirror.com,https://www.aeomirror.com
      - key: APP_BASE_URL
        value: https://aeomirror.com
      # The frontend (aeomirror.com, Vercel) and this API (its own Render host,
      # NOT the same domain — see API_BASE_URL's own note below) are genuinely
      # cross-SITE. config.py's default, AUTH_COOKIE_SAMESITE=strict, is NEVER
      # sent by the browser on a cross-site request — no CORS setting can change
      # that — so every user's silent session refresh on page load (auth/client.js
      # ::refreshSession, called from AuthContext.jsx on mount) failed every time,
      # logging them straight back out to /login on any hard refresh. 'none'
      # (paired with Secure=true, already forced on in production, and HttpOnly,
      # already always on) is the correct, standard setting for this split-domain
      # topology — not a security downgrade. A production startup check
      # (app/config.py::_validate_production) now refuses to boot with a stricter
      # value whenever APP_BASE_URL/API_BASE_URL are on different domains.
      - key: AUTH_COOKIE_SAMESITE
        value: none
      # The API's OWN public base URL (distinct from APP_BASE_URL, the frontend's).
      # Used for links the API itself serves — the digest unsubscribe page, and the
      # AI Business Impact tracker.js/collect URLs baked into every install snippet
      # (see app/api/routes_tracking.py's _snippet). Unset here, it silently fell
      # back to config.py's dev default (http://localhost:8000), which is exactly
      # why production snippets were shipping a localhost tracker URL.
      #
      # IMPORTANT: this MUST be the actual live API host. DEPLOYMENT.md/README.md
      # document a custom domain, https://api.aeomirror.com, as canonical — but as
      # of 2026-10-26 that hostname has NO DNS record at all (confirmed via Google's
      # public resolver: dns.google/resolve?name=api.aeomirror.com -> NXDOMAIN). The
      # live frontend's own build (its compiled JS bundle, fetched directly from
      # https://www.aeomirror.com) calls https://aeomirror.onrender.com, which DOES
      # respond correctly to /healthz and /t/tracker.js. Pointed at the real,
      # DNS-confirmed host below — repoint this to api.aeomirror.com ONLY once that
      # custom domain is actually attached to the Render service and resolves, and
      # update VITE_API_URL (Vercel) + CORS_ORIGINS/docs to match at the same time.
      - key: API_BASE_URL
        value: https://aeomirror.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: aeomirror-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aeomirror-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true   # stable, Render-generated secret
      # Set in the dashboard (do not commit):
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      # Outbound email = Resend HTTPS API (SMTP is blocked on Render). Set both:
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM        # must be an address on a Resend-verified domain, e.g. "AEOMirror <noreply@aeomirror.com>"
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false          # optional; AI features stay off when unset
      # Google Analytics 4 integration (P0). Leave unset to keep it fully disabled
      # (connect returns 503). See backend/GOOGLE_ANALYTICS_SETUP.md.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false   # the API service's own public URL + /integrations/google/callback
      - key: TOKEN_ENCRYPTION_KEY
        sync: false          # required the moment the three GOOGLE_OAUTH_* vars above are set

  # ---------------- monitoring worker ----------------
  - type: worker
    name: aeomirror-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python run_worker.py
    plan: starter
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aeomirror-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aeomirror-redis
          property: connectionString
      - key: APP_BASE_URL
        value: https://aeomirror.com
      # Outbound email = Resend HTTPS API (worker sends monitoring alerts + weekly digest).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM        # address on a Resend-verified domain, e.g. "AEOMirror <noreply@aeomirror.com>"
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false          # worker generates AI report content for bulk/scheduled jobs
      # The worker runs ga4_sync jobs (decrypts the stored refresh token, calls Google
      # directly) — needs the same four values as the API service.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false          # MUST be the same value as the API service's
