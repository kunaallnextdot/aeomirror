<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F14" />

    <!-- Aurora design-system fonts (Phase 1 additive: available for incremental token
         aliasing; existing Hanken/Inter/IBM Plex Mono still load via App.jsx @import). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Primary meta -->
    <title>AEOMirror — AI Visibility Scanner for ChatGPT, Claude, Gemini & Perplexity</title>
    <meta name="description" content="AEOMirror scans any website and shows exactly what AI engines like ChatGPT, Claude, Gemini and Perplexity can read, understand and cite — then hands you the fixes." />
    <meta name="keywords" content="AI visibility, AEO, answer engine optimization, ChatGPT SEO, llms.txt, GPTBot, structured data, AI crawler" />
    <meta name="author" content="AEOMirror" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://aeomirror.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AEOMirror" />
    <meta property="og:title" content="AEOMirror — AI Visibility Scanner" />
    <meta property="og:description" content="See what ChatGPT, Claude, Gemini and Perplexity can read and cite on your site — and get the fixes." />
    <meta property="og:url" content="https://aeomirror.com/" />
    <meta property="og:image" content="https://aeomirror.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AEOMirror — AI Visibility Scanner" />
    <meta name="twitter:description" content="See what ChatGPT, Claude, Gemini and Perplexity can read and cite on your site — and get the fixes." />
    <meta name="twitter:image" content="https://aeomirror.com/og-image.png" />

    <!-- Structured data: Organization + SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "AEOMirror",
            "url": "https://aeomirror.com",
            "logo": "https://aeomirror.com/logo.png"
          },
          {
            "@type": "SoftwareApplication",
            "name": "AEOMirror",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://aeomirror.com",
            "description": "AI visibility scanner that reports what AI engines can read and cite on a website and provides prioritized fixes.",
            "offers": [
              { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
              { "@type": "Offer", "name": "Pro", "price": "29", "priceCurrency": "USD" }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
