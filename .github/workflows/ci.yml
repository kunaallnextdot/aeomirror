name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (syntax / import check)
        run: python -m compileall -q app
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.aeomirror.com

  # Deployment is handled by the platforms' Git integrations on push to main:
  #   - Frontend: Vercel (frontend/, vercel.json)
  #   - Backend + worker: Render (render.yaml, autoDeploy: true)
  # This CI gates those deploys by requiring the jobs above to pass first.
